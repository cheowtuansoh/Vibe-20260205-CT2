<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CT's Travel Itinerary Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CT's Travel Itinerary Generator</h1>
    </header>
    <main>
        <div class="selector-container">
            <div>
                <label for="country-select">Choose a country:</label>
                <select id="country-select">
                    <option value="">--Please choose a country--</option>
                </select>
            </div>
             <div>
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date">
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date">
            </div>
            <div>
                <label for="interest-select">Interest:</label>
                <select id="interest-select">
                    <option value="">--Select an interest--</option>
                    <option value="shopping">Shopping</option>
                    <option value="dining">Dining</option>
                    <option value="sightseeing">Sightseeing</option>
                </select>
            </div>
        </div>
        <div id="itinerary-container">
            <!-- Itinerary will be generated here -->
        </div>
        <button id="generate-button">Generate Itinerary</button>
    </main>
    <script src="countries.js"></script>
    <script src="main.js"></script>
</body>
</html>
